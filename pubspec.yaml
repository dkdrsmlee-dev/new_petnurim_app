name: new_petnurim_app
description: "Flutter 중심으로 구현하는 펫누림 모바일 앱입니다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # iOS 스타일 아이콘을 사용할 때 필요한 기본 아이콘 패키지입니다.
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  http: ^1.6.0
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5
  kakao_flutter_sdk: ^2.0.0+1
  webview_flutter: ^4.10.0
  flutter_svg: ^2.0.10
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  image_picker: ^1.2.2
  file_picker: ^8.0.0
  mime: ^2.0.0
  http_parser: ^4.1.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter 권장 린트 규칙을 적용합니다.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/banner/

flutter_native_splash:
  color: "#7F4FFF"
  image: assets/images/splash_logo_fill.png

  android_12:
    color: "#7F4FFF"
    image: assets/images/splash_logo_android12.png
