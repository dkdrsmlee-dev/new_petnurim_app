name: new_petnurim_app
description: "Flutter 중심으로 구현하는 펫누림 모바일 앱입니다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # iOS 스타일 아이콘을 사용할 때 필요한 기본 아이콘 패키지입니다.
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  http: ^1.6.0
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter 권장 린트 규칙을 적용합니다.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
